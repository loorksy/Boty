name: CI dispatch

# The running matrix is .github/workflows/checks.yml.
# This path already exists on main as workflow_dispatch only. Leaving the
# same trigger here avoids a second full run after checks.yml is merged.
on:
  workflow_dispatch:

jobs:
  notice:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "The check matrix is .github/workflows/checks.yml"
